<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Range Predictor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,255,255,0.1); width: 350px; border: 1px solid #333; }
        h2 { text-align: center; color: #00ffff; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #aaa; }
        input[type="number"], select { width: 100%; padding: 10px; border: none; border-radius: 6px; background-color: #2c2c2c; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; background-color: #00ffff; color: #000; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #00cccc; }
        .result-box { margin-top: 20px; padding: 15px; background-color: #000; border-radius: 8px; text-align: center; border: 1px solid #00ffff; }
        .result-value { font-size: 28px; font-weight: bold; color: #00ffff; }
        .note { font-size: 11px; color: #777; margin-top: 5px; text-align: right; }
    </style>
</head>
<body>

<div class="card">
    <h2>EV Range Predictor</h2>
    
    <!-- NEW: Vehicle Preset Dropdown -->
    <div class="form-group">
        <label>Select Vehicle</label>
        <select id="preset" onchange="updatePreset()">
            <option value="custom" data-batt="75" data-eff="1.0">Custom / Generic EV</option>
            <option value="model3" data-batt="60" data-eff="1.15">Tesla Model 3 (Standard)</option>
            <option value="ioniq5" data-batt="77" data-eff="0.95">Hyundai Ioniq 5 (Long Range)</option>
            <option value="nexon" data-batt="40" data-eff="0.88">Tata Nexon EV (Long Range)</option>
            <option value="hummer" data-batt="212" data-eff="0.65">GMC Hummer EV (Heavy SUV)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Battery Capacity (kWh)</label>
        <input type="number" id="battery" value="75">
    </div>
    
    <div class="form-group">
        <label>Outside Temperature (°C)</label>
        <input type="number" id="temp" value="20">
    </div>
    
    <div class="form-group">
        <label>Average Speed (km/h)</label>
        <input type="number" id="speed" value="60">
    </div>
    
    <div class="form-group">
        <label>AC / Heater</label>
        <select id="ac">
            <option value="0">Off</option>
            <option value="1">On</option>
        </select>
    </div>
    
    <button onclick="makePrediction()">Predict Range</button>
    
    <div class="result-box">
        <div style="font-size: 12px; color: #aaa;">Estimated Real-World Range</div>
        <div class="result-value" id="result">-- km</div>
    </div>
</div>

<script>
    // NEW: Function to automatically update battery when preset changes
    function updatePreset() {
        const select = document.getElementById('preset');
        const selectedOption = select.options[select.selectedIndex];
        
        // Only override the battery input if they didn't choose "Custom"
        if (select.value !== "custom") {
            document.getElementById('battery').value = selectedOption.getAttribute('data-batt');
        }
    }

    async function makePrediction() {
        const resultDiv = document.getElementById('result');
        resultDiv.innerText = "Calculating...";

        const select = document.getElementById('preset');
        const selectedOption = select.options[select.selectedIndex];

        // Gather data, including the hidden efficiency factor from the dropdown
        const data = {
            battery: document.getElementById('battery').value,
            temp: document.getElementById('temp').value,
            speed: document.getElementById('speed').value,
            ac: document.getElementById('ac').value,
            efficiency: selectedOption.getAttribute('data-eff') // Grab from data-eff attribute
        };

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            const resultData = await response.json();
            resultDiv.innerText = resultData.prediction + " km";
            
        } catch (error) {
            resultDiv.innerText = "Error";
            console.error('Error:', error);
        }
    }
</script>

</body>
</html>
